<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Box-Score-Rechner</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1eeea;--ac:#e8590c;--mut:#6b6b6b;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:720px}
h1{font-size:1.4rem;margin:0}button,input,select{font:inherit;color:var(--fg)}button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}button.s{background:var(--card);color:var(--fg)}
input,select{background:var(--card);border:1px solid #8884;border-radius:8px;padding:8px;width:100%}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:.8rem;color:var(--mut);display:block}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.score-pill{background:var(--ac);color:#fff;font-weight:800;font-size:1.1rem;padding:4px 12px;border-radius:99px}
table{width:100%;border-collapse:collapse}th{font-size:.72rem;color:var(--mut);text-align:center;padding-bottom:4px}td{padding:3px 2px}
.num-box{display:flex;align-items:center;justify-content:center;gap:2px}
.num-box input{padding:5px 2px;text-align:center;width:40px;font-weight:600}
.st-btn{padding:4px 7px;border-radius:6px;font-size:.85rem;background:var(--bg);color:var(--fg);border:1px solid #8883;line-height:1}
td:first-child input{text-align:left;min-width:95px}
.w{overflow-x:auto}tfoot td{font-weight:700;text-align:center;padding-top:8px;border-top:1px solid #8883}pre{white-space:pre-wrap;font:inherit;margin:0;font-size:.92rem}</style></head><body>
<div class="hdr">
  <h1>📊 Box-Score-Rechner</h1>
  <div class="score-pill" id="totPts">0 PTS</div>
</div>
<div class="card"><label>Spiel / Gegner</label><input id="g" placeholder="z. B. Heimspiel gegen die Eagles"></div>
<div class="card w"><table><thead><tr><th style="text-align:left">Spieler</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TOV</th><th>EFF</th><th></th></tr></thead><tbody id="b"></tbody><tfoot><tr id="f"></tr></tfoot></table></div>
<div class="row" style="margin-bottom:12px">
  <button id="add">+ Spieler</button>
  <button class="s" id="cp">Bericht kopieren</button>
  <button class="s" id="rst">Werte 0</button>
</div>
<div class="card"><label>Spielbericht</label><pre id="rep"></pre></div>
<script>
const B=document.getElementById("b"),KEY="bb_boxscore_v2";let n=0;

function makeCell(val){
  const td=document.createElement("td");
  td.innerHTML='<div class="num-box"><input type="number" inputmode="numeric" min="0" value="'+(val||0)+'"><button type="button" class="st-btn">+</button></div>';
  const inp=td.querySelector("input"),btn=td.querySelector("button");
  btn.onclick=()=>{inp.value=(+inp.value||0)+1;calc()};
  return td;
}

function add(data){
  n++;const tr=document.createElement("tr");
  const name=data?data.n:("Spieler "+n);
  const vals=data?data.v:[0,0,0,0,0,0];
  const tdName=document.createElement("td");
  tdName.innerHTML='<input value="'+name.replace(/"/g,"&quot;")+'">';
  tr.appendChild(tdName);
  vals.forEach(v=>tr.appendChild(makeCell(v)));
  const tdEff=document.createElement("td");
  tdEff.style.cssText="text-align:center;font-weight:700;padding:0 6px";tdEff.textContent="0";
  tr.appendChild(tdEff);
  const tdDel=document.createElement("td");
  tdDel.innerHTML='<button type="button" class="s" style="padding:4px 8px">✕</button>';
  tdDel.querySelector("button").onclick=()=>{tr.remove();calc()};
  tr.appendChild(tdDel);
  B.appendChild(tr);calc();
}

B.oninput=()=>calc();

function calc(){
  const T=[0,0,0,0,0,0,0],rows=[];
  [...B.children].forEach(tr=>{
    const i=tr.querySelectorAll("input");
    const v=[1,2,3,4,5,6].map(k=>+i[k].value||0);
    // EFF = PTS + REB + AST + STL + BLK - TOV
    const e=v[0]+v[1]+v[2]+v[3]+v[4]-v[5];
    tr.children[7].textContent=e;
    v.forEach((x,k)=>T[k]+=x);T[6]+=e;
    rows.push({n:i[0].value,v,e});
  });
  document.getElementById("totPts").textContent=T[0]+" PTS";
  document.getElementById("f").innerHTML='<td style="text-align:left">Team</td>'+T.map(x=>"<td>"+x+"</td>").join("")+"<td></td>";
  const top=(k,l)=>{if(!rows.length)return"";const m=Math.max(...rows.map(r=>r.v[k]));return m>0?l+": "+rows.filter(r=>r.v[k]==m).map(r=>r.n).join(", ")+" ("+m+")\n":""};
  const best=rows.length?rows.reduce((a,b)=>b.e>a.e?b:a):null;
  const gTitle=document.getElementById("g").value;
  document.getElementById("rep").textContent=
    (gTitle||"Spielbericht")+"\n\n"+
    "Team: "+T[0]+" PTS | "+T[1]+" REB | "+T[2]+" AST | "+T[3]+" STL | "+T[4]+" BLK | "+T[5]+" TOV\n"+
    top(0,"Topscorer")+top(1,"Meiste Rebounds")+top(2,"Meiste Assists")+top(3,"Meiste Steals")+top(4,"Meiste Blocks")+
    (best&&best.e>0?"MVP / Effizientester Spieler: "+best.n+" (EFF "+best.e+")\n":"")+
    "\n(EFF = PTS + REB + AST + STL + BLK - TOV)";
  try{localStorage.setItem(KEY,JSON.stringify({g:gTitle,rows}))}catch(e){}
}

document.getElementById("g").oninput=calc;
document.getElementById("add").onclick=()=>add();
document.getElementById("rst").onclick=()=>{
  [...B.children].forEach(tr=>{const i=tr.querySelectorAll("input");for(let k=1;k<=6;k++)i[k].value=0});
  calc();
};
document.getElementById("cp").onclick=()=>{
  try{navigator.clipboard.writeText(document.getElementById("rep").textContent);const b=document.getElementById("cp");b.textContent="Kopiert ✓";setTimeout(()=>b.textContent="Bericht kopieren",1500)}catch(e){}
};

try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(saved&&saved.rows&&saved.rows.length){
    document.getElementById("g").value=saved.g||"";
    saved.rows.forEach(r=>add(r));
  }else{for(let i=0;i<5;i++)add()}
}catch(e){for(let i=0;i<5;i++)add()}
</script></body></html>
