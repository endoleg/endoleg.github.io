<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Intervall-Timer</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1eeea;--ac:#e8590c;--mut:#6b6b6b;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:720px}
h1{font-size:1.4rem;margin:0}button,input,select{font:inherit;color:var(--fg)}button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}button.s{background:var(--card);color:var(--fg);border:1px solid #8883}button.active-preset{border:2px solid var(--ac)}
input,select{background:var(--card);border:1px solid #8884;border-radius:8px;padding:8px;width:100%}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:.8rem;color:var(--mut);display:block}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
#disp{transition:background .15s;padding:22px 14px}
#t{font-size:min(24vw,6.2rem);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#ph{text-align:center;font-size:1.5rem;font-weight:800;letter-spacing:.1em}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-bottom:12px}
.presets button{padding:8px 6px;font-size:.78rem}
.hint{font-size:.82rem;color:var(--mut);min-height:1.2em;margin-top:6px;text-align:center}
.camp-tools{display:none;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #8883;font-size:.8rem}
.camp-tools.show{display:flex;flex-wrap:wrap}
.camp-tools button{padding:6px 10px;font-size:.78rem}
@media(max-width:520px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<div class="head">
  <h1>🏀 Intervall-Timer</h1>
  <div class="row">
    <button type="button" class="s" id="muteBtn" style="padding:8px 12px;font-size:.85rem">🔊 Ton an</button>
    <button type="button" class="s" id="toneModeBtn" style="padding:8px 12px;font-size:.85rem">📢 Pfiff</button>
  </div>
</div>
<div class="presets" id="presetBar">
  <button type="button" class="s" data-mode="std" data-w="45" data-r="15" data-n="8">🎯 Wurf-Drill<br><small>45s / 15s × 8</small></button>
  <button type="button" class="s" data-mode="std" data-w="20" data-r="10" data-n="8">🔥 Tabata<br><small>20s / 10s × 8</small></button>
  <button type="button" class="s" data-mode="std" data-w="30" data-r="30" data-n="6">🏃 Suicides<br><small>30s / 30s × 6</small></button>
  <button type="button" class="s" id="campPresetBtn" data-mode="camp" data-w="16" data-r="2" data-n="4">🏕️ Camp<br><small>16m / 2m × 4</small></button>
</div>
<div class="card" id="disp">
  <div id="ph">BEREIT</div>
  <div id="t">00:45</div>
  <div id="rd" style="text-align:center;color:var(--mut);margin-top:4px">Runde 0 / 8</div>
  <div class="hint" id="meta">Gesamtdauer: 08:00</div>
</div>
<div class="card">
  <div class="g">
    <div><label id="lblW">Arbeit (Sek.)</label><input id="w" type="number" value="45" min="1" step="any"></div>
    <div><label id="lblR">Pause (Sek.)</label><input id="r" type="number" value="15" min="0" step="any"></div>
    <div><label id="lblN">Runden</label><input id="n" type="number" value="8" min="1"></div>
    <div><label>Vorlauf</label>
      <select id="pre">
        <option value="0">0 Sek.</option>
        <option value="5" selected>5 Sek.</option>
        <option value="10">10 Sek.</option>
      </select>
    </div>
  </div>
  <div class="camp-tools" id="campTools">
    <span style="color:var(--mut)">🔔 Signale: Halbzeit &amp; 3 Min. vor Ende (Gong) · Ende (Alarm)</span>
    <div class="row">
      <button type="button" class="s" id="testGongBtn">🔔 Gong testen</button>
      <button type="button" class="s" id="testAlarmBtn">🚨 Alarm testen</button>
    </div>
  </div>
</div>
<div class="row" style="margin-bottom:8px">
  <button id="go" style="flex:2;font-size:1.1rem">Start</button>
  <button class="s" id="rs" style="flex:1">Reset</button>
  <button class="s" id="savePreset" style="flex:1">💾 Preset</button>
</div>
<div class="hint" id="statusHint">Tipp: Leertaste startet/pausiert · Änderungen während des Laufs greifen nach Reset.</div>
<script>
const $=i=>document.getElementById(i);
let AC,iv=null,st=null,wakeLock=null,muted=false,softTone=false,campMode=false;

async function setWake(on){try{if(on&&"wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen");else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&iv){setWake(true);unlockAudio()}});

function unlockAudio(){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function beep(f,d,vol=.28){if(muted)return;try{unlockAudio();const o=AC.createOscillator(),g=AC.createGain();o.type=softTone?"sine":"triangle";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.value=softTone?vol*.55:vol;o.start();g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

function gong(count=1){
  if(muted)return;
  unlockAudio();
  const strike=(delay)=>{
    setTimeout(()=>{
      try{
        if(!AC)return;
        const now=AC.currentTime;
        const freqs=[196,293.66,392,587.33];
        const vols=[0.42,0.22,0.14,0.08];
        freqs.forEach((f,idx)=>{
          const o=AC.createOscillator(),g=AC.createGain();
          o.type=idx===0?"sine":"triangle";
          o.frequency.setValueAtTime(f,now);
          g.gain.setValueAtTime(0.001,now);
          g.gain.linearRampToValueAtTime(vols[idx],now+0.02);
          g.gain.exponentialRampToValueAtTime(0.0008,now+2.4);
          o.connect(g);g.connect(AC.destination);
          o.start(now);o.stop(now+2.5);
        });
      }catch(e){}
    },delay);
  };
  strike(0);
  if(count>1)strike(650);
}

function campAlarm(){
  if(muted)return;
  unlockAudio();
  const tones=[880,659.25,880,659.25,1046.5];
  tones.forEach((f,i)=>setTimeout(()=>beep(f,0.28,0.42),i*260));
}

function whistle(){if(softTone){beep(587,.22,.22);setTimeout(()=>beep(784,.28,.22),220)}else{beep(2600,.16);setTimeout(()=>beep(2850,.28),190)}}
function endSignal(){if(campMode){campAlarm();return}if(softTone){beep(523,.25,.22);setTimeout(()=>beep(659,.35,.22),260)}else{whistle();setTimeout(whistle,550)}}

const fmt=s=>{const x=Math.max(0,Math.round(s));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};

function getVals(){
  const mult=campMode?60:1;
  const rawW=Math.max(0.1,+$("w").value||(campMode?16:45));
  const rawR=Math.max(0,+$("r").value||0);
  const N=Math.max(1,Math.round(+$("n").value)||1);
  const P=Math.max(0,+$("pre").value||0);
  return {W:Math.round(rawW*mult),R:Math.round(rawR*mult),N,P,rawW,rawR};
}

function totalSeconds(){
  const {W,R,N,P}=getVals();
  const pauses=N>1?(N-1)*R:0;
  return P+N*W+pauses;
}

function updateMeta(){
  if(!st)$("meta").textContent="Gesamtdauer: "+fmt(totalSeconds());
}

function show(){
  if(!st)return;
  $("t").textContent=fmt(Math.max(0,Math.ceil(st.left)));
  $("ph").textContent=st.ph;
  $("rd").textContent=(st.camp?"Station ":"Runde ")+st.rd+" / "+st.N;
  const isWork=st.ph==="ARBEIT"||st.ph==="STATION";
  const isPause=st.ph==="PAUSE"||st.ph==="WECHSEL";
  $("disp").style.background=isWork?"#2f9e4466":isPause?"#f0a40066":st.ph==="VORLAUF"?"#1c6dd055":"";
  if(st.customMeta){
    $("meta").textContent=st.customMeta;
  }else if(st.camp){
    $("meta").textContent=st.ph==="VORLAUF"?"Aufstellung an den Stationen...":isWork?"Stationszeit läuft":"Wechsel zur nächsten Station!";
  }else{
    $("meta").textContent=st.ph==="VORLAUF"?"Mach dich bereit...":isWork?"Voller Fokus!":"Kurz durchatmen";
  }
}

function begin(ph,rd){
  st.ph=ph;st.rd=rd;st.c=-1;
  st.halfFired=false;st.threeMinFired=false;st.customMeta="";
  const over=Math.min(0,st.left||0);
  const isWork=ph==="ARBEIT"||ph==="STATION";
  st.left=(ph==="VORLAUF"?st.P:isWork?st.W:st.R)+over;
  if(st.camp){
    if(ph==="STATION")gong(1);
    else if(ph==="WECHSEL")campAlarm();
  }else{
    if(ph==="ARBEIT")whistle();
    else if(ph==="PAUSE")beep(softTone?392:440,.4);
  }
}

function tick(){
  const now=Date.now();st.left-=(now-st.last)/1000;st.last=now;
  const c=Math.ceil(st.left);

  if(st.camp&&st.ph==="STATION"&&st.left>0){
    const half=st.W/2;
    if(!st.halfFired&&st.W>=120&&st.left<=half){
      st.halfFired=true;
      gong(1);
      st.customMeta="🔔 Halbzeit! ("+fmt(half)+" vorbei)";
    }
    if(!st.threeMinFired&&st.W>240&&st.left<=180){
      st.threeMinFired=true;
      gong(2);
      st.customMeta="🔔 Noch 3 Minuten bis zum Stationswechsel!";
    }
  }

  if(c!==st.c&&c<=3&&c>0){
    if(st.camp)beep(523,.14,.25);
    else beep(softTone?523:660,.12,.2);
  }
  st.c=c;

  if(st.left<=0){
    const workLabel=st.camp?"STATION":"ARBEIT";
    const pauseLabel=st.camp?"WECHSEL":"PAUSE";
    if(st.ph==="VORLAUF")begin(workLabel,1);
    else if(st.ph===workLabel){
      if(st.rd>=st.N)return fin();
      if(st.R>0)begin(pauseLabel,st.rd);else begin(workLabel,st.rd+1);
    }else begin(workLabel,st.rd+1);
  }
  show();
}

function fin(){
  clearInterval(iv);iv=null;setWake(false);
  $("ph").textContent="FERTIG ✓";$("t").textContent="00:00";$("disp").style.background="";
  $("meta").textContent=(campMode?"Camp-Durchlauf abgeschlossen! ":"Set abgeschlossen! ")+"Gesamtdauer: "+fmt(totalSeconds());
  endSignal();
  $("go").textContent="Start";st=null;
}

function toggleStartPause(){
  unlockAudio();
  if(iv){clearInterval(iv);iv=null;setWake(false);$("go").textContent="Weiter";$("meta").textContent="Pausiert";return}
  if(!st){
    const {W,R,N,P,rawW,rawR}=getVals();
    $("w").value=rawW;$("r").value=rawR;$("n").value=N;
    st={W,R,N,P,camp:campMode};
    const workLabel=campMode?"STATION":"ARBEIT";
    if(P>0)begin("VORLAUF",1);else begin(workLabel,1);
  }
  setWake(true);st.last=Date.now();iv=setInterval(tick,100);$("go").textContent="Anhalten";show();
}

$("go").onclick=toggleStartPause;

function setMode(mode){
  campMode=(mode==="camp");
  $("lblW").textContent=campMode?"Station (Min.)":"Arbeit (Sek.)";
  $("lblR").textContent=campMode?"Wechsel (Min.)":"Pause (Sek.)";
  $("lblN").textContent=campMode?"Stationen":"Runden";
  $("campTools").classList.toggle("show",campMode);
  $("campPresetBtn").classList.toggle("active-preset",campMode);
}

function resetUI(){
  clearInterval(iv);iv=null;st=null;setWake(false);
  const {W,N}=getVals();
  $("go").textContent="Start";$("ph").textContent="BEREIT";
  $("t").textContent=fmt(W);
  $("rd").textContent=(campMode?"Station 0 / ":"Runde 0 / ")+N;
  $("disp").style.background="";
  $("statusHint").textContent="Tipp: Leertaste startet/pausiert · Änderungen während des Laufs greifen nach Reset.";
  updateMeta();
}
$("rs").onclick=resetUI;

["w","r","n","pre"].forEach(id=>$(id).oninput=()=>{
  if(!st)resetUI();
  else{updateMeta();$("statusHint").textContent="Hinweis: Geänderte Werte werden nach Reset aktiv."}
});

$("muteBtn").onclick=()=>{
  muted=!muted;
  $("muteBtn").textContent=muted?"🔇 Aus":"🔊 Ton an";
  if(!muted)unlockAudio();
};

$("toneModeBtn").onclick=()=>{
  softTone=!softTone;
  $("toneModeBtn").textContent=softTone?"🎵 Sanft":"📢 Pfiff";
  beep(softTone?523:2400,.12,.2);
};

$("testGongBtn").onclick=()=>gong(1);
$("testAlarmBtn").onclick=()=>campAlarm();

function renderCustomPresets(){
  document.querySelectorAll(".custom-preset").forEach(el=>el.remove());
  try{
    const list=JSON.parse(localStorage.getItem("customPresets")||"[]");
    list.forEach((p,idx)=>{
      const isCamp=p.mode==="camp";
      const unit=isCamp?"m":"s";
      const b=document.createElement("button");
      b.type="button";b.className="s custom-preset";
      b.dataset.mode=p.mode||"std";b.dataset.w=p.w;b.dataset.r=p.r;b.dataset.n=p.n;
      b.innerHTML=(isCamp?"🏕️ ":"⭐ ")+p.name+"<br><small>"+p.w+unit+" / "+p.r+unit+" × "+p.n+"</small>";
      b.title="Klicken zum Laden, Doppelklick zum Löschen";
      b.onclick=()=>applyPreset(p.w,p.r,p.n,p.mode||"std");
      b.ondblclick=()=>{
        const next=list.filter((_,i)=>i!==idx);
        localStorage.setItem("customPresets",JSON.stringify(next));
        renderCustomPresets();
      };
      $("presetBar").appendChild(b);
    });
  }catch(e){}
}

function applyPreset(w,r,n,mode="std"){
  setMode(mode);
  $("w").value=w;$("r").value=r;$("n").value=n;
  resetUI();
}

document.querySelectorAll("#presetBar button").forEach(b=>{
  b.onclick=()=>applyPreset(b.dataset.w,b.dataset.r,b.dataset.n,b.dataset.mode||"std");
});

$("savePreset").onclick=()=>{
  const {rawW,rawR,N}=getVals();
  const name=prompt("Name für dein Preset (z. B. "+(campMode?"Vormittags-Camp":"Athletik A")+"):")?.trim();
  if(!name)return;
  try{
    const list=JSON.parse(localStorage.getItem("customPresets")||"[]");
    list.push({name:name.slice(0,16),w:rawW,r:rawR,n:N,mode:campMode?"camp":"std"});
    localStorage.setItem("customPresets",JSON.stringify(list.slice(-6)));
    renderCustomPresets();
  }catch(e){}
};

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)){
    e.preventDefault();toggleStartPause();
  }
});

renderCustomPresets();
resetUI();
</script></body></html>
