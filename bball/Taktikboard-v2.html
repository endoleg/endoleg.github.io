<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Taktikboard</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1eeea;--ac:#e8590c;--mut:#6b6b6b;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:720px}
h1{font-size:1.4rem;margin:0 0 12px}button,input,select{font:inherit;color:var(--fg)}button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}button.s{background:var(--card);color:var(--fg)}
input,select{background:var(--card);border:1px solid #8884;border-radius:8px;padding:8px;width:100%}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
canvas{width:100%;display:block;touch-action:none;border-radius:12px;background:#d9a35f}.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px}.tools button{padding:8px 2px;font-size:.72rem;line-height:1.2}.tools button span{display:block;font-size:1.15rem}.on{outline:3px solid var(--fg);outline-offset:-1px}.m{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px;z-index:9}.m img{max-width:100%;max-height:75%;border-radius:8px}</style></head><body>
<h1>📋 Taktikboard</h1>
<div class="row" style="margin-bottom:8px">
  <input id="ti" placeholder="Name des Spielzugs (z. B. Horns Pick & Roll)" style="flex:1;min-width:180px">
  <button class="s" id="sv">💾 Speichern</button>
</div>
<div class="row" style="margin-bottom:8px">
  <select id="ld" style="flex:1"><option value="">Gespeicherte Spielzüge laden...</option></select>
  <button class="s" id="dl" title="Ausgewählten Spielzug löschen">🗑️</button>
</div>
<div class="tools" id="tl">
  <button data-t="move" class="on"><span>✋</span>Bewegen</button>
  <button data-t="run" class="s"><span>➤</span>Laufweg</button>
  <button data-t="drib" class="s"><span>〰</span>Dribbling</button>
  <button data-t="pass" class="s"><span>⋯</span>Pass</button>
  <button data-t="screen" class="s"><span>⊥</span>Block</button>
  <button data-t="del" class="s"><span>🧽</span>Radierer</button>
</div>
<canvas id="c"></canvas>
<div class="row" style="margin:10px 0">
  <button class="s" id="un">↶ Zurück</button>
  <button class="s" id="re">↷ Vor</button>
  <button class="s" id="cl">Wege löschen</button>
  <button class="s" id="mdMode">Halbfeld</button>
  <button class="s" id="df">Defense ✓</button>
  <button class="s" id="rs">Reset</button>
</div>
<button id="ex" style="width:100%">⬇ Als Bild speichern / teilen (PNG)</button>
<p style="color:var(--mut);font-size:.82rem;margin-top:8px">Blau = Angriff, Pink = Verteidigung. Laufweg gestrichelt, Dribbling gewellt, Pass gepunktet, Block mit T-Balken.</p>
<div class="m" id="md"><img id="im" alt="Taktikboard"><div style="color:#fff">Bild gedrückt halten zum Speichern</div><button id="mc">Schließen</button></div>
<script>
const $=i=>document.getElementById(i),cv=$("c"),ctx=cv.getContext("2d"),W=500;
let H=470,full=false,tool="move",pl=[],ln=[],hist=[],fut=[],showD=true,drag=null,cur=null,erasing=false;
const KEY="bb_plays_v2";

function init(){
  pl=[];
  if(!full){
    for(let i=0;i<5;i++)pl.push({n:i+1,t:"o",x:70+i*90,y:215+(i%2)*30});
    for(let i=0;i<5;i++)pl.push({n:i+1,t:"d",x:70+i*90,y:110-(i%2)*30});
    pl.push({n:"🏀",t:"b",x:250,y:345});
  }else{
    for(let i=0;i<5;i++)pl.push({n:i+1,t:"o",x:90+i*80,y:620+(i%2)*35});
    for(let i=0;i<5;i++)pl.push({n:i+1,t:"d",x:90+i*80,y:520-(i%2)*35});
    pl.push({n:"🏀",t:"b",x:250,y:730});
  }
  ln=[];
}
function snap(){hist.push(JSON.stringify({pl,ln,full}));if(hist.length>60)hist.shift();fut=[]}
function loadState(s){const o=JSON.parse(s);pl=o.pl;ln=o.ln;if(o.full!==undefined&&o.full!==full){full=o.full;H=full?880:470;$("mdMode").textContent=full?"Ganzfeld":"Halbfeld";size()}else draw()}
function size(){const w=cv.clientWidth,d=window.devicePixelRatio||1;cv.width=w*d;cv.height=w*H/W*d;cv.style.height=w*H/W+"px";draw()}

function halfCourt(g,oy,flip){
  g.save();
  if(flip){g.translate(0,oy+470);g.scale(1,-1)}else{g.translate(0,oy)}
  g.strokeStyle="#fff";g.lineWidth=3;g.fillStyle="#c9904a";
  g.fillRect(170,270,160,190);
  g.strokeRect(170,270,160,190);
  g.beginPath();g.arc(250,270,80,Math.PI,0);g.stroke();
  g.setLineDash([8,8]);g.beginPath();g.arc(250,270,80,0,Math.PI);g.stroke();g.setLineDash([]);
  g.beginPath();g.moveTo(50,460);g.lineTo(50,385);g.arc(250,425,200,Math.PI+.2,-.2);g.moveTo(450,385);g.lineTo(450,460);g.stroke();
  g.beginPath();g.moveTo(220,440);g.lineTo(280,440);g.stroke();
  g.strokeStyle="#e8590c";g.beginPath();g.arc(250,425,9,0,7);g.stroke();
  g.restore();
}

function court(g){
  g.fillStyle="#d9a35f";g.fillRect(0,0,W,H);
  g.strokeStyle="#fff";g.lineWidth=3;
  if(!full){
    g.strokeRect(10,10,480,450);
    halfCourt(g,0,false);
  }else{
    g.strokeRect(10,10,480,860);
    g.beginPath();g.moveTo(10,440);g.lineTo(490,440);g.stroke();
    g.beginPath();g.arc(250,440,65,0,7);g.stroke();
    halfCourt(g,0,true);
    halfCourt(g,410,false);
  }
}

function wavy(p){const o=[p[0]];let d=0;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!l)continue;const nx=-(b[1]-a[1])/l,ny=(b[0]-a[0])/l;for(let s=0;s<l;s+=3){d+=3;const k=5*Math.sin(d/4);o.push([a[0]+(b[0]-a[0])*s/l+nx*k,a[1]+(b[1]-a[1])*s/l+ny*k])}}o.push(p[p.length-1]);return o}

function line(g,l){
  const p=l.pts;if(p.length<2)return;
  g.lineCap="round";g.lineJoin="round";
  g.strokeStyle=l.type=="pass"?"#ffe066":l.type=="screen"?"#74c0fc":"#fff";
  g.lineWidth=l.type=="pass"?3:4;
  g.setLineDash(l.type=="run"?[11,8]:l.type=="pass"?[2,9]:[]);
  const q=l.type=="drib"?wavy(p):p;
  g.beginPath();q.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.stroke();g.setLineDash([]);
  const a=p[p.length-1],b=p[Math.max(0,p.length-6)],an=Math.atan2(a[1]-b[1],a[0]-b[0]);
  g.lineWidth=4;
  if(l.type==="screen"){
    const px=-Math.sin(an)*15,py=Math.cos(an)*15;
    g.beginPath();g.moveTo(a[0]-px,a[1]-py);g.lineTo(a[0]+px,a[1]+py);g.stroke();
  }else{
    g.beginPath();
    g.moveTo(a[0]-16*Math.cos(an-.45),a[1]-16*Math.sin(an-.45));
    g.lineTo(a[0],a[1]);
    g.lineTo(a[0]-16*Math.cos(an+.45),a[1]-16*Math.sin(an+.45));
    g.stroke();
  }
}

function scene(g,title){
  court(g);ln.forEach(l=>line(g,l));if(cur)line(g,cur);
  pl.forEach(p=>{
    if(p.t=="d"&&!showD)return;
    const r=p.t=="b"?13:19;
    g.fillStyle=p.t=="o"?"#1c6dd0":p.t=="d"?"#d6336c":"#e8590c";
    g.strokeStyle="#fff";g.lineWidth=3;
    g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill();g.stroke();
    g.fillStyle="#fff";g.font="700 "+(p.t=="b"?14:16)+"px system-ui";
    g.textAlign="center";g.textBaseline="middle";g.fillText(p.n,p.x,p.y+1);
  });
  if(title){
    g.font="700 18px system-ui";const w=g.measureText(title).width+24;
    g.fillStyle="#000a";g.beginPath();g.roundRect(250-w/2,18,w,30,8);g.fill();
    g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(title,250,33);
  }
}

function draw(){const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);scene(ctx,$("ti").value.trim())}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function hit(x,y){for(let i=pl.length-1;i>=0;i--){const p=pl[i];if(p.t=="d"&&!showD)continue;if(Math.hypot(p.x-x,p.y-y)<(p.t=="b"?18:24))return p}}
function erase(x,y){const n=ln.length;ln=ln.filter(l=>!l.pts.some(v=>Math.hypot(v[0]-x,v[1]-y)<15));if(ln.length!=n)draw()}

cv.addEventListener("pointerdown",e=>{const[x,y]=pt(e);cv.setPointerCapture(e.pointerId);
  if(tool=="move"){const p=hit(x,y);if(p){snap();drag={p,dx:p.x-x,dy:p.y-y}}}
  else if(tool=="del"){snap();erasing=true;erase(x,y)}
  else cur={type:tool,pts:[[x,y]]}});
cv.addEventListener("pointermove",e=>{const[x,y]=pt(e);
  if(drag){drag.p.x=Math.max(15,Math.min(485,x+drag.dx));drag.p.y=Math.max(15,Math.min(H-15,y+drag.dy));draw()}
  else if(erasing)erase(x,y);
  else if(cur){const l=cur.pts[cur.pts.length-1];if(Math.hypot(x-l[0],y-l[1])>5){cur.pts.push([x,y]);draw()}}});
function up(){if(cur){if(cur.pts.length>3){snap();ln.push(cur)}cur=null;draw()}drag=null;erasing=false}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

$("tl").onclick=e=>{const b=e.target.closest("button");if(!b)return;tool=b.dataset.t;[...$("tl").children].forEach(x=>x.className=x==b?"on":"s");cv.style.cursor=tool=="move"?"grab":"crosshair"};
$("un").onclick=()=>{if(!hist.length)return;fut.push(JSON.stringify({pl,ln,full}));loadState(hist.pop())};
$("re").onclick=()=>{if(!fut.length)return;hist.push(JSON.stringify({pl,ln,full}));loadState(fut.pop())};
$("cl").onclick=()=>{if(ln.length){snap();ln=[];draw()}};
$("rs").onclick=()=>{snap();init();draw()};
$("df").onclick=()=>{showD=!showD;$("df").textContent="Defense "+(showD?"✓":"✗");draw()};
$("mdMode").onclick=()=>{snap();full=!full;H=full?880:470;$("mdMode").textContent=full?"Ganzfeld":"Halbfeld";init();size()};
$("ti").oninput=draw;

function getPlays(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function refreshPlays(){
  const plays=getPlays(),sel=$("ld"),curVal=sel.value;
  sel.innerHTML='<option value="">Gespeicherte Spielzüge ('+Object.keys(plays).length+')...</option>';
  Object.keys(plays).sort().forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o)});
  if(plays[curVal])sel.value=curVal;
}
$("sv").onclick=()=>{
  const name=$("ti").value.trim()||("Spielzug "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  const plays=getPlays();plays[name]={pl,ln,full};
  localStorage.setItem(KEY,JSON.stringify(plays));refreshPlays();$("ld").value=name;
  $("sv").textContent="Gespeichert ✓";setTimeout(()=>$("sv").textContent="💾 Speichern",1200);
};
$("ld").onchange=()=>{
  const name=$("ld").value,plays=getPlays();if(!name||!plays[name])return;
  snap();$("ti").value=name;loadState(JSON.stringify(plays[name]));
};
$("dl").onclick=()=>{
  const name=$("ld").value,plays=getPlays();if(!name||!plays[name])return;
  delete plays[name];localStorage.setItem(KEY,JSON.stringify(plays));refreshPlays();
};

$("ex").onclick=async()=>{
  const o=document.createElement("canvas");o.width=W*2;o.height=H*2;const g=o.getContext("2d");g.scale(2,2);scene(g,$("ti").value.trim());
  const blob=await new Promise(r=>o.toBlob(r,"image/png"));
  const fname=(($("ti").value.trim()||"spielzug").toLowerCase().replace(/[^a-z0-9äöüß]+/g,"-").replace(/^-|-$/g,"")||"spielzug")+".png";
  const file=new File([blob],fname,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:$("ti").value.trim()||"Taktikboard"});return}catch(e){}
  }
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  }catch(e){
    $("im").src=o.toDataURL("image/png");$("md").style.display="flex";
  }
};
$("mc").onclick=()=>$("md").style.display="none";
addEventListener("resize",size);refreshPlays();init();size();
</script></body></html>
