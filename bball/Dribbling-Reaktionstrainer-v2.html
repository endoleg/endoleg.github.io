<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dribbling-Reaktionstrainer</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1eeea;--ac:#e8590c;--mut:#6b6b6b;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f2f2f2;--card:#232323;--ac:#ff8a3d;--mut:#9a9a9a}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:720px}
h1{font-size:1.4rem;margin:0 0 12px}button,input,select{font:inherit;color:var(--fg)}button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}
input,select{background:var(--card);border:1px solid #8884;border-radius:8px;padding:8px;width:100%}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:4px}
#s{height:44vh;min-height:250px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;background:#444;transition:background .1s;user-select:none;padding:12px}
#big{font-size:min(28vw,8.5rem);line-height:1}#lb{font-size:1.8rem}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-top:10px;cursor:pointer}.chk input{width:auto}
</style></head><body>
<h1>⚡ Dribbling-Reaktionstrainer</h1>
<div id="s"><div id="big">🏀</div><div id="lb">Start drücken</div></div>
<p id="cnt" style="text-align:center;color:var(--mut);margin:8px 0">Signale: 0 · Zeit: 00:00</p>
<div class="card">
  <div class="g">
    <div><label>Modus</label><select id="md"><option value="0">Farben (Moves)</option><option value="1">Richtungen</option><option value="2" selected>Beides gemischt</option></select></div>
    <div><label>Tempo (Sek.)</label><select id="sp"><option value="1">1.0 Sek. (Pro)</option><option value="1.5">1.5 Sek. (Schnell)</option><option value="2" selected>2.0 Sek. (Normal)</option><option value="3">3.0 Sek. (Einsteiger)</option><option value="rnd">Zufällig (1.2–2.8s)</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="tts" checked> 🔊 Befehle laut ansagen (Kopf oben halten!)</label>
</div>
<div class="card" style="font-size:.88rem"><b>Farben:</b> 🔴 Stopp · 🟢 Sprint · 🔵 Crossover links · 🟡 Crossover rechts<br><b>Pfeile:</b> Dribbling in die angezeigte Richtung</div>
<button id="go" style="width:100%;font-size:1.2rem">Training starten</button>
<script>
const $=i=>document.getElementById(i);let tm=null,clockIv=null,startTs=0,n=0,lastKey="",AC,wakeLock=null;
const C=[["#d62828","Stopp"],["#2f9e44","Sprint"],["#1c6dd0","Crossover links"],["#d99b00","Crossover rechts"]],
      D=[["←","Links"],["→","Rechts"],["↑","Vorwärts"],["↓","Rückwärts"]];

async function setWake(on){try{if(on&&"wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen");else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&tm)setWake(true)});

function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=750;o.connect(g);g.connect(AC.destination);g.gain.value=.15;o.start();o.stop(AC.currentTime+.07)}catch(e){}}
function speak(txt){if(!$("tts").checked||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";u.rate=1.25;speechSynthesis.speak(u)}
function updClock(){const sec=Math.floor((Date.now()-startTs)/1000);const m=String(Math.floor(sec/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");$("cnt").textContent=`Signale: ${n} · Zeit: ${m}:${s}`}

function sig(){
  const m=+$("md").value;
  let t,idx,key;
  do{t=m==2?Math.floor(Math.random()*2):m;idx=Math.floor(Math.random()*4);key=t+"-"+idx}while(key===lastKey);
  lastKey=key;n++;updClock();
  if(!$("tts").checked)beep();
  if(t==0){const[c,l]=C[idx];$("s").style.background=c;$("big").textContent="";$("lb").textContent=l;$("lb").style.fontSize="2.4rem";speak(l)}
  else{const[a,l]=D[idx];$("s").style.background="#2b2d42";$("big").textContent=a;$("lb").textContent=l;$("lb").style.fontSize="1.6rem";speak(l)}
  const val=$("sp").value,delay=val==="rnd"?(1200+Math.random()*1600):(+val*1000);
  tm=setTimeout(sig,delay);
}

$("go").onclick=()=>{
  if(tm){clearTimeout(tm);tm=null;clearInterval(clockIv);setWake(false);if("speechSynthesis"in window)speechSynthesis.cancel();$("go").textContent="Training starten";$("s").style.background="#444";$("big").textContent="🏀";$("lb").textContent="Gestoppt";return}
  n=0;lastKey="";startTs=Date.now();$("go").textContent="Stopp";setWake(true);clockIv=setInterval(updClock,1000);sig();
};
</script></body></html>
